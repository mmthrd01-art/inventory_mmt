<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Mitra Multi Teknik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#0a2a66; --navy2:#0d3b8c; --blue:#1565c0; --blue2:#1e88e5;
  --sky:#e8f3fd; --sky2:#cfe6fb; --sky3:#9fd0f7; --line:#c9ddf2;
  --ink:#0b2147; --muted:#5a7396; --white:#fff;
  --ok:#1b8a5a; --okbg:#dcf5e8; --bad:#c62828; --badbg:#fde4e4; --warn:#b26a00; --warnbg:#fff0d6;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--sky);color:var(--ink);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}

/* Layout */
.app{display:flex;min-height:100%}
.side{width:260px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .logo span{font-weight:800;color:var(--navy2);font-size:18px}
.brand h1{font-size:15px;font-weight:800;line-height:1.25}
.brand small{display:block;font-weight:500;opacity:.7;font-size:11.5px;margin-top:2px}
nav{padding:12px 10px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:transparent;color:rgba(255,255,255,.82);border-radius:10px;cursor:pointer;text-align:left;font-weight:600;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.09)}
nav button.on{background:#fff;color:var(--navy2)}
nav button svg{width:19px;height:19px;flex:none}
nav .badge{margin-left:auto;background:#ff5252;color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;font-weight:800}
.mode{margin:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:12px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#5df2a4;flex:none}
.dot.local{background:#ffc857}
.main{margin-left:260px;flex:1;min-width:0}
.top{display:none;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
.content{padding:26px 30px 60px;max-width:1280px}
h2.pt{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 18px}

/* Alarm banner */
.alarm{display:none;background:linear-gradient(90deg,#b71c1c,#e53935);color:#fff;padding:12px 30px;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:15}
.alarm.show{display:flex}
.alarm .bell{font-size:22px;animation:ring 1s infinite}
.alarm b{font-weight:800}
.alarm .txt{flex:1;min-width:200px}
.alarm button{background:#fff;color:#b71c1c;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
.alarm button.ghost{background:rgba(255,255,255,.18);color:#fff}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.alarm .bell{animation:none}}

/* Cards, table */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(10,42,102,.05)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:180px;max-width:360px;position:relative}
.toolbar input.q{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.toolbar input.q:focus{border-color:var(--blue2);outline:none}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--navy2)}
.btn.light{background:var(--sky2);color:var(--navy2)}
.btn.light:hover{background:var(--sky3)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.danger:hover{background:#f9c9c9}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ok{background:var(--okbg);color:var(--ok)}
.btn.ok:hover{background:#bfeed6}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{background:var(--navy);color:#fff;text-align:left;padding:12px 14px;font-weight:700;font-size:13px;white-space:nowrap}
th:first-child{border-top-left-radius:var(--r)}th:last-child{border-top-right-radius:var(--r)}
td{padding:11px 14px;border-bottom:1px solid #e3eefa;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f4f9ff}
tr.late td{background:#fff5f5}
.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:var(--sky)}
.nophoto{width:48px;height:48px;border-radius:9px;background:var(--sky);border:1px dashed var(--sky3);display:grid;place-items:center;color:var(--sky3);font-size:11px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-weight:700;font-size:12px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.info{background:var(--sky2);color:var(--navy2)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:4px}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:18px 20px;border-left:6px solid var(--blue2)}
.stat .n{font-size:34px;font-weight:800;color:var(--navy);line-height:1.1}
.stat .l{color:var(--muted);font-weight:600}
.stat.red{border-left-color:#e53935}.stat.red .n{color:#c62828}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card h3{padding:16px 18px 6px;font-size:16px;color:var(--navy)}
.card .pad{padding:8px 18px 18px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e8f1fb}
.row:last-child{border-bottom:0}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(6,25,62,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal header{padding:18px 22px;background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;border-radius:18px 18px 0 0;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal header button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}
.modal form{padding:20px 22px 22px;display:grid;gap:14px}
.fld label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfdff}
.fld input:focus,.fld select:focus{border-color:var(--blue2);outline:none;background:#fff}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbox img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--sky)}
.imgbox .ph{width:84px;height:84px;border-radius:12px;border:2px dashed var(--sky3);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;background:var(--sky)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.lb{background:rgba(6,25,62,.85)}
.lb img{max-width:94vw;max-height:90vh;border-radius:12px;background:#fff}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:90;font-weight:600;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:#b71c1c}
.setgrid{display:grid;gap:16px;max-width:760px}
.setgrid .card{padding:20px}
.setgrid h3{padding:0 0 12px}
textarea.cfg{min-height:170px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.note{background:var(--sky);border:1px solid var(--sky2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--navy);margin-top:10px}
.note ol{margin:6px 0 0 18px}

.gc{width:40px;padding-right:0!important}
.grip{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--blue);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip:hover{background:var(--sky2)}
.grip.off{opacity:.3;cursor:not-allowed}
tr.dragging td{background:#d6ebff!important}
tr.dragging td:first-child{box-shadow:inset 4px 0 0 var(--blue2)}
body.dnd,body.dnd *{user-select:none;-webkit-user-select:none;cursor:grabbing!important}
.toolbar select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
@media print{
  .side,.top,.alarm,.toolbar,.acts,.scrim,.toast,.gc{display:none!important}
  .main{margin:0}.content{padding:0}.card{box-shadow:none}
  th:last-child,td:last-child{display:none}
  th{background:#0a2a66!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
}
@media (max-width:860px){
  .side{transform:translateX(-100%)}
  .side.open{transform:none}
  .main{margin-left:0}
  .top{display:flex}
  .content{padding:18px 14px 60px}
  .alarm{padding:12px 14px}
  .two{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25;display:none}
  .scrim.show{display:block}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo" id="brandLogo"><span>MT</span></div>
      <h1 id="brandName">Inventory Mitra Multi Teknik<small>Alat kerja &amp; part</small></h1>
    </div>
    <nav id="nav"></nav>
    <div class="mode"><span class="dot" id="modeDot"></span><span id="modeTxt">Memuat…</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="top"><button id="burger" aria-label="Menu">☰</button><b id="topName">Inventory</b></div>
    <div class="alarm" id="alarm" role="alert">
      <span class="bell">🔔</span>
      <div class="txt" id="alarmTxt"></div>
      <button id="alarmView">Lihat</button>
      <button class="ghost" id="alarmMute">Diamkan 1 jam</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="ov lb" id="lb"><img id="lbImg" alt="Foto"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   KONFIGURASI FIREBASE
   Opsi 1: isi langsung di bawah ini.
   Opsi 2: biarkan kosong, lalu tempel di menu Pengaturan > Koneksi Firebase.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey": "AIzaSyDmlXUjYaSYb4WL1rWBdSUjLezIqR7slf4",
  authDomain": "inventory-mmt.firebaseapp.com",
  projectId": "inventory-mmt",
  storageBucket": "inventory-mmt.firebasestorage.app",
  messagingSenderId": "984802344383",
  appId": "1:984802344383:web:0a5afb7f6515d23f7e750a",
  measurementId": "G-HXPL3R2BPK"
};

/* ---------- Util ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayStr = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (str, n) => { const d = new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); };
const fmtDate = s => s ? new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '—';
let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3200); }

function compressImage(file, max=720, type='image/jpeg', q=0.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Gagal membaca file'));
    fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error('File bukan gambar'));
      im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas');
        c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const x=c.getContext('2d');
        if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}
        x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL(type,q)); };
      im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- Lapisan data: Firebase Firestore atau Mode Lokal ---------- */
const Local = {
  L:{}, read(c){ try{return JSON.parse(localStorage.getItem('mmt_'+c)||'[]')}catch(e){return[]} },
  write(c,a){ try{localStorage.setItem('mmt_'+c,JSON.stringify(a))}catch(e){toast('Penyimpanan lokal penuh. Gunakan Firebase.',true)} (this.L[c]||[]).forEach(f=>f(a)); },
  sub(c,cb){ (this.L[c]=this.L[c]||[]).push(cb); cb(this.read(c)); },
  async add(c,d){ const a=this.read(c); a.push({id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d}); this.write(c,a); },
  async update(c,id,d){ this.write(c,this.read(c).map(x=>x.id===id?{...x,...d}:x)); },
  async set(c,id,d){ const a=this.read(c); const i=a.findIndex(x=>x.id===id); if(i<0)a.push({id,...d}); else a[i]={...a[i],...d}; this.write(c,a); },
  async remove(c,id){ this.write(c,this.read(c).filter(x=>x.id!==id)); }
};
const Fire = {
  init(cfg){ if(!firebase.apps.length) firebase.initializeApp(cfg); this.db=firebase.firestore(); },
  sub(c,cb){ this.db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>toast('Firebase: '+e.message,true)); },
  add(c,d){ return this.db.collection(c).add(d); },
  update(c,id,d){ return this.db.collection(c).doc(id).update(d); },
  set(c,id,d){ return this.db.collection(c).doc(id).set(d,{merge:true}); },
  remove(c,id){ return this.db.collection(c).doc(id).delete(); }
};
function getFbConfig(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) return FIREBASE_CONFIG;
  try{ const c=JSON.parse(localStorage.getItem('mmt_fbconfig')||'null'); if(c&&c.projectId) return c; }catch(e){}
  return null;
}
let DB = Local, MODE = 'local';
(function(){
  const cfg=getFbConfig();
  if(cfg && typeof firebase!=='undefined'){
    try{ Fire.init(cfg); DB=Fire; MODE='firebase'; }catch(e){ console.error(e); }
  }
})();

/* ---------- State ---------- */
const S = { technicians:[], tools:[], loans:[], techStock:[], cylinders:[], stockLog:[], settings:{} };
let page = 'dashboard', query = '', loanFilter = 'all';
const DEF = { namaApp:'Inventory Mitra Multi Teknik', logo:'', alarmDays:0, jamBatas:'17:00' };
const cfgApp = () => ({...DEF, ...(S.settings||{})});

/* ---------- Definisi modul ---------- */
const KONDISI3 = ['Baik','Rusak','Hilang'];
const KONDISI2 = ['Baik','Rusak'];
const JABATAN = ['Teknisi','Helper','Senior Teknisi','Supervisor','Admin Gudang'];
const byId = (arr,id) => arr.find(x=>x.id===id);
const techName = id => byId(S.technicians,id)?.nama || '(teknisi dihapus)';
const toolName = id => { const t=byId(S.tools,id); return t ? t.nama+(t.nomor?' · '+t.nomor:'') : '(alat dihapus)'; };
const kondPill = k => `<span class="pill ${k==='Baik'?'ok':k==='Rusak'?'warn':'bad'}">${esc(k)}</span>`;
const photo = src => src ? `<img class="thumb" src="${src}" data-zoom alt="Foto">` : `<div class="nophoto">no foto</div>`;
const activeLoanQty = toolId => S.loans.filter(l=>l.alatId===toolId && !l.tanggalKembali).reduce((a,l)=>a+(+l.jumlah||0),0);
const availQty = t => (+t.jumlah||0) - activeLoanQty(t.id);
const isLow = t => (+t.minStok||0)>0 && availQty(t) <= +t.minStok;
const byOrder = (a,b) => ((a.urutan??-1)-(b.urutan??-1)) || ((a.createdAt||0)-(b.createdAt||0));
const sorted = k => [...S[k]].sort(byOrder);

const MOD = {
  technicians:{ title:'Data Teknisi', sub:'Daftar teknisi dan helper Mitra Multi Teknik.', add:'Tambah teknisi', icon:'users',
    fields:[
      {k:'nama',l:'Nama Teknisi / Helper',t:'text',req:1},
      {k:'jabatan',l:'Jabatan',t:'select',opts:JABATAN,req:1}
    ],
    cols:[ ['Nama',r=>`<b>${esc(r.nama)}</b>`], ['Jabatan',r=>`<span class="pill info">${esc(r.jabatan)}</span>`] ],
    text:r=>[r.nama,r.jabatan], sortable:true },
  tools:{ title:'Inventaris Alat & Part', sub:'Seluruh alat dan part yang ada di gudang.', add:'Tambah alat / part', icon:'box',
    fields:[
      {k:'nama',l:'Nama Alat / Part',t:'text',req:1},
      {k:'nomor',l:'Nomor Alat',t:'text',req:1,half:1},
      {k:'kategori',l:'Kategori',t:'select',opts:['Alat','Part','Bahan habis pakai'],req:1,half:1},
      {k:'jumlah',l:'Jumlah di gudang',t:'number',req:1,def:1,min:0,half:1},
      {k:'satuan',l:'Satuan',t:'text',def:'pcs',half:1},
      {k:'lokasi',l:'Lokasi / Rak',t:'text',half:1},
      {k:'minStok',l:'Stok minimum',t:'number',def:0,min:0,half:1,hint:'0 = tanpa peringatan'},
      {k:'kondisi',l:'Kondisi',t:'select',opts:KONDISI3,req:1},
      {k:'foto',l:'Foto Alat',t:'image'}
    ],
    cols:[ ['Foto',r=>photo(r.foto)], ['Nama Alat',r=>`<b>${esc(r.nama)}</b>`], ['Nomor',r=>esc(r.nomor)],
      ['Kategori',r=>r.kategori?`<span class="pill info">${esc(r.kategori)}</span>`:'—'],
      ['Lokasi',r=>esc(r.lokasi||'—')],
      ['Jumlah',r=>`${esc(r.jumlah)} ${esc(r.satuan||'')}${activeLoanQty(r.id)?` <small style="color:var(--muted)">(${activeLoanQty(r.id)} dipinjam)</small>`:''}${isLow(r)?' <span class="pill bad">Stok menipis</span>':''}`],
      ['Kondisi',r=>kondPill(r.kondisi)] ],
    text:r=>[r.nama,r.nomor,r.kondisi,r.kategori,r.lokasi], sortable:true },
  loans:{ title:'Pengambilan Alat', sub:'Catat alat yang diambil teknisi dari gudang dan kapan dikembalikan.', add:'Catat pengambilan', icon:'out',
    fields:[
      {k:'tanggal',l:'Tanggal Pengambilan',t:'date',req:1,def:()=>todayStr()},
      {k:'teknisiId',l:'Nama Teknisi',t:'ref-tech',req:1},
      {k:'alatId',l:'Jenis Alat',t:'ref-tool',req:1},

function dueDate(l){ const j=cfgApp().jamBatas||'17:00'; return new Date((l.jatuhTempo||l.tanggal)+'T'+j+':00'); }
function loanStatus(l){
  if(l.tanggalKembali) return {key:'back',label:'Sudah kembali',cls:'ok'};
  if(new Date() >= dueDate(l)) return {key:'late',label:'Belum kembali!',cls:'bad'};
  return {key:'out',label:'Dipinjam',cls:'warn'};
}
const loanPill = l => { const s=loanStatus(l); return `<span class="pill ${s.cls}">${s.label}</span>`; };
const overdue = () => S.loans.filter(l=>loanStatus(l).key==='late');

let audioCtx=null, muteUntil=+localStorage.getItem('mmt_mute')||0, lastBeep=0;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    [0,.28,.56].forEach(t=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='square'; o.frequency.value=t===.28?660:880;
      g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.22);
      o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.25);
    });
  }catch(e){}
}
let titleBase=document.title, blink=false;
function checkAlarm(){
  const od=overdue(), b=$('#alarm');
  const badge=$('#navBadge'); if(badge){ badge.textContent=od.length; badge.style.display=od.length?'':'none'; }
  if(!od.length){ b.classList.remove('show'); document.title=titleBase; return; }
  const names=[...new Set(od.map(l=>techName(l.teknisiId)))];
  $('#alarmTxt').innerHTML=`<b>${od.length} pengambilan alat belum kembali</b> — ${esc(names.slice(0,3).join(', '))}${names.length>3?' dan lainnya':''}`;
  b.classList.add('show');
  blink=!blink; document.title=(blink?'🔔 ':'')+`(${od.length}) ${titleBase}`;
  const now=Date.now();
  if(now>muteUntil && now-lastBeep>60000){ lastBeep=now; beep();
    if('Notification' in window && Notification.permission==='granted'){ try{ new Notification('Alat belum kembali',{body:`${od.length} pengambilan melewati batas waktu.`}); }catch(e){} } }
}

function openForm(key,id){
  const m=MOD[key], row=id?byId(S[key],id):null;
  if(key==='loans'&&!id){ if(!S.technicians.length) return toast('Isi Data Teknisi terlebih dahulu',true); if(!S.tools.some(t=>t.kondisi==='Baik')) return toast('Belum ada alat berkondisi Baik di gudang',true); }
  if(key==='techStock'&&!id&&!S.technicians.length) return toast('Isi Data Teknisi terlebih dahulu',true);
  Object.keys(imgState).forEach(k=>delete imgState[k]);
  m.fields.filter(f=>f.t==='image').forEach(f=>imgState[f.k]=row?.[f.k]||'');
  const parts=m.fields.map(f=>{ let v=row?row[f.k]:(typeof f.def==='function'?f.def():f.def); return {h:fieldHTML(f,v??''),half:!!f.half}; });
  let body='';
  for(let i=0;i<parts.length;i++){ if(parts[i].half&&parts[i+1]&&parts[i+1].half){ body+=`<div class="two">${parts[i].h}${parts[i+1].h}</div>`; i++; } else body+=parts[i].h; }
  $('#modal').innerHTML=`<header><span>${id?'Ubah':'Tambah'} · ${m.title}</span><button type="button" data-close aria-label="Tutup">×</button></header>
    <form id="form" novalidate>${body}<div class="mf"><button type="button" class="btn light" data-close>Batal</button><button class="btn" type="submit">Simpan</button></div></form>`;
  $('#ov').classList.add('show');
  $('#form').onsubmit=e=>{ e.preventDefault(); saveForm(key,id); };
  const first=$('#form input,#form select'); first&&first.focus();
}
function closeModal(){ $('#ov').classList.remove('show'); }
async function saveForm(key,id){
  const m=MOD[key], fd=new FormData($('#form')), data={};
  for(const f of m.fields){
    if(f.t==='image'){ data[f.k]=imgState[f.k]||''; continue; }
    let v=(fd.get(f.k)||'').toString().trim();
    if(f.req&&!v) return toast(`${f.l} wajib diisi`,true);
    data[f.k]= f.t==='number' ? (v===''?0:Math.max(0,parseInt(v,10)||0)) : v;
  }
  if(key==='loans'){
    const t=byId(S.tools,data.alatId); const used=S.loans.filter(l=>l.alatId===data.alatId&&!l.tanggalKembali&&l.id!==id).reduce((a,l)=>a+(+l.jumlah||0),0);
    if(!data.tanggalKembali && t && data.jumlah>(+t.jumlah||0)-used) return toast(`Stok ${t.nama} hanya tersedia ${(+t.jumlah||0)-used}`,true);
    if(data.tanggalKembali && data.tanggalKembali<data.tanggal) return toast('Tanggal dikembalikan tidak boleh sebelum tanggal pengambilan',true);
    if(data.jatuhTempo<data.tanggal) return toast('Batas pengembalian tidak boleh sebelum tanggal pengambilan',true);
  }
  try{
    if(key==='stockLog'){
      const t=byId(S.tools,data.alatId); if(!t) return toast('Alat tidak ditemukan',true);
      if(data.jumlah<1) return toast('Jumlah minimal 1',true);
      if(data.tipe==='Keluar' && data.jumlah>availQty(t)) return toast(`Stok ${t.nama} yang tersedia hanya ${availQty(t)}`,true);
      await DB.update('tools',t.id,{jumlah:(+t.jumlah||0)+(data.tipe==='Masuk'?data.jumlah:-data.jumlah)});
      await DB.add(key,{...data,namaAlat:t.nama,createdAt:Date.now()});
    }
    else if(id) await DB.update(key,id,data);
    else await DB.add(key,{...data,...(m.sortable?{urutan:Math.max(-1,...S[key].map(r=>r.urutan??-1))+1}:{}),createdAt:Date.now()});
    closeModal(); toast(id?'Perubahan disimpan':'Data ditambahkan');
  }catch(e){ toast('Gagal menyimpan: '+e.message,true); }
}

/* ---------- Pengaturan ---------- */

        <div class="fld"><label for="s_hari">Batas default (hari)</label><input id="s_hari" type="number" min="0" value="${esc(c.alarmDays)}"><div class="hint">0 = harus kembali di hari yang sama.</div></div></div>

    <div class="card"><h3>Cadangan data</h3><p style="color:var(--muted);margin-bottom:12px">Unduh seluruh data (termasuk foto) sebagai file JSON, atau pulihkan dari file cadangan.</p><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn light" id="bkExp" type="button">Unduh cadangan</button><label class="btn light" style="cursor:pointer">Pulihkan dari file<input type="file" id="bkImp" accept="application/json,.json" hidden></label></div></div>
    <div class="card"><h3>Koneksi Firebase</h3>

    ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{ const m=txt.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']')); if(m) cfg[k]=m[1]; });
    if(!cfg.projectId||!cfg.apiKey) return toast('Konfigurasi tidak lengkap: apiKey dan projectId wajib ada',true);

/* ---------- Ekspor CSV ---------- */
function exportCsv(key){
  const m=MOD[key], rows=rowsOf(key); if(!rows.length) return toast('Tidak ada data untuk diunduh',true);
  const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
  const cols=m.cols.filter(c=>c[0]!=='Foto');
  const lines=[cols.map(c=>c[0]).join(',')].concat(rows.map(r=>cols.map(c=>'"'+strip(c[1](r)).replace(/"/g,'""')+'"').join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`${key}-${todayStr()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- Event global ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='ov') return closeModal();
  if(t.closest('#lb')) return $('#lb').classList.remove('show');
  const z=t.closest('[data-zoom]'); if(z){ $('#lbImg').src=z.src; return $('#lb').classList.add('show'); }
  const ed=t.closest('[data-edit]'); if(ed) return openForm(page,ed.dataset.edit);
  const del=t.closest('[data-del]'); if(del){
    const delMsg=page==='stockLog'?'Hapus catatan ini? Jumlah stok alat akan dikembalikan seperti sebelum mutasi.':'Hapus data ini? Tindakan ini tidak bisa dibatalkan.';
    if(confirm(delMsg)){ try{
      if(page==='stockLog'){ const lg=byId(S.stockLog,del.dataset.del), t=lg&&byId(S.tools,lg.alatId);
        if(t) await DB.update('tools',t.id,{jumlah:Math.max(0,(+t.jumlah||0)+(lg.tipe==='Masuk'?-lg.jumlah:+lg.jumlah))}); }
      await DB.remove(page,del.dataset.del); toast('Data dihapus'); }catch(er){ toast('Gagal menghapus: '+er.message,true); } } return; }
  const rt=t.closest('[data-return]'); if(rt){ try{ await DB.update('loans',rt.dataset.return,{tanggalKembali:todayStr()}); toast('Alat ditandai sudah dikembalikan'); }catch(er){ toast(er.message,true); } return; }
  const rm=t.closest('[data-rmimg]'); if(rm){ imgState[rm.dataset.rmimg]=''; $('#prev_'+rm.dataset.rmimg).innerHTML='<div class="ph">Belum ada foto</div>'; rm.remove(); }
});
document.addEventListener('change',async e=>{
  const f=e.target.closest('[data-img]'); if(!f||!f.files[0]) return;
  try{ const k=f.dataset.img; imgState[k]=await compressImage(f.files[0]); $('#prev_'+k).innerHTML=`<img src="${imgState[k]}" alt="">`; }
  catch(er){ toast(er.message,true); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('#lb').classList.remove('show'); } });

/* ---------- Geser untuk mengubah urutan ---------- */
function gripCell(off){
  return `<td class="gc"><span class="grip${off?' off':''}" title="${off?'Hapus kata pencarian untuk mengatur urutan':'Tahan lalu geser untuk mengubah urutan'}"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="9" cy="5.5" r="1.7"/><circle cx="15" cy="5.5" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18.5" r="1.7"/><circle cx="15" cy="18.5" r="1.7"/></svg></span></td>`;
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  if(g.classList.contains('off')){ toast('Hapus kata pencarian dulu untuk mengatur urutan'); return; }
  const tr=g.closest('tr'), host=$('#tbl'); if(!tr||!host) return;
  e.preventDefault();
  drag={tr,tb:tr.parentNode,pid:e.pointerId,key:page};
  try{ host.setPointerCapture(e.pointerId); }catch(er){}
  tr.classList.add('dragging'); document.body.classList.add('dnd');
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  let before=null;
  for(const r of drag.tb.children){ if(r===drag.tr) continue; const b=r.getBoundingClientRect(); if(e.clientY<b.top+b.height/2){ before=r; break; } }
  if(before!==drag.tr.nextElementSibling) drag.tb.insertBefore(drag.tr,before);
  if(e.clientY<90) window.scrollBy(0,-16); else if(e.clientY>innerHeight-90) window.scrollBy(0,16);
});
function endDrag(){
  if(!drag) return; const {tr,tb,key}=drag; drag=null;
  tr.classList.remove('dragging'); document.body.classList.remove('dnd');
  saveOrder(key,[...tb.children].map(r=>r.dataset.id));
}
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,e=>{ if(drag&&e.pointerId===drag.pid) endDrag(); }));
async function saveOrder(key,ids){
  if(ids.join()===rowsOf(key).map(r=>r.id).join()) return;
  const ups=[]; ids.forEach((id,i)=>{ const r=byId(S[key],id); if(r&&r.urutan!==i){ r.urutan=i; ups.push(DB.update(key,id,{urutan:i})); } });
  renderTable();
  try{ await Promise.all(ups); toast('Urutan disimpan'); }catch(er){ toast('Gagal menyimpan urutan: '+er.message,true); }
}

/* ---------- Mulai ---------- */
function refresh(){
  if(page==='dashboard') renderDashboard(); else if(page!=='settings') renderTable();
  checkAlarm();
}
Object.keys(MOD).forEach(k=>DB.sub(k,rows=>{ S[k]=rows; refresh(); }));
DB.sub('settings',rows=>{ S.settings=rows.find(r=>r.id==='app')||{}; applyBrand(); if(page==='dashboard') renderDashboard(); });
applyBrand(); renderNav(); renderPage();
setInterval(()=>{ if(page==='loans'||page==='dashboard') refresh(); },30000);
</script>
