  .modal textarea{resize:vertical;min-height:60px;}

/* =========================================================================
   3. FIRESTORE LISTENERS
========================================================================= */
function attachListeners(){
  if(!db) return;
  db.collection('alatTeknisi').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.alat = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('stokMaterial').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.material = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('peminjaman').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.pinjam = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('peminjamanFreon').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.freon = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

async function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.72;
  if(!file || !file.type || !file.type.startsWith('image/')) return file;
  try{
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if(width > maxDim || height > maxDim){
      const ratio = Math.min(maxDim/width, maxDim/height);
      width = Math.round(width*ratio); height = Math.round(height*ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, width, height);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    if(!blob || blob.size >= file.size) return file; // jika hasil kompres tidak lebih kecil, pakai file asli
    return new File([blob], (file.name||'foto').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch(e){
    return file; // kalau gagal kompres (browser lama dll), pakai file asli
  }
}

async function uploadPhoto(file, folder, onProgress){
  if(!file || !storage) return "";
  const compressed = await compressImage(file);
  const ref = storage.ref().child(folder + '/' + Date.now() + '_' + compressed.name);
  return await new Promise((resolve, reject)=>{
    const task = ref.put(compressed);
    task.on('state_changed',
      (snap)=>{
        if(onProgress){
          const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          onProgress(pct);
        }
      },
      (err)=> reject(err),
      async ()=>{
        try{ const url = await task.snapshot.ref.getDownloadURL(); resolve(url); }
        catch(err){ reject(err); }
      }
    );
  });
}

/* =========================================================================
   4. LOGIN
========================================================================= */
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="login-logo">MMT</div>
        <h1>Inventory Simitra</h1>
        <div class="sub">CV Mitra Multi Teknik</div>
        <input id="li-user" type="text" placeholder="Username" autocomplete="username" />
        <input id="li-pass" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="li-btn">Masuk</button>

      </div>
    </div>
  `;
  const doLogin = () => {
    const u = document.getElementById('li-user').value.trim();
    const p = document.getElementById('li-pass').value.trim();
    if(u === APP_USERNAME && p === APP_PASSWORD){
      sessionStorage.setItem('simitra_logged_in','1');

      document.getElementById('li-err').textContent = 'Username atau password salah.';

  document.getElementById('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

/* =========================================================================
   5. HELPERS
========================================================================= */
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badgeClass(k){ return k==='Baik'?'baik': k==='Rusak'?'rusak':'hilang'; }
function matchesKategori(namaAlat, matches){
  const n = (namaAlat||'').toLowerCase();
  return matches.some(m => n.includes(m));
}
function countKategori(key){
  const kat = KATEGORI_DASHBOARD.find(k=>k.key===key);
  return state.alat.filter(a=>matchesKategori(a.namaAlat, kat.match))
    .reduce((sum,a)=> sum + (parseInt(a.jumlah)||0), 0);
}
function itemsKategori(key){
  const kat = KATEGORI_DASHBOARD.find(k=>k.key===key);
  return state.alat.filter(a=>matchesKategori(a.namaAlat, kat.match));
}
function rusakHilangItems(){
  return state.alat.filter(a=> a.kondisi==='Rusak' || a.kondisi==='Hilang');
}

/* =========================================================================
   6. MAIN RENDER
========================================================================= */
function render(){
  if(!state.loggedIn){ renderLogin(); return; }
  const app = document.getElementById('app');

  const tabs = [
    {key:'dashboard', label:'Dashboard'},
    {key:'alat', label:'Alat Kerja Teknisi'},
    {key:'material', label:'Stok Material WS'},
    {key:'pinjam', label:'Kartu Peminjaman Alat'},
    {key:'freon', label:'Peminjaman Freon'},
  ];

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">📦 Inventory Simitra <span class="small">CV Mitra Multi Teknik</span></div>
      <button class="logout-btn" id="logout-btn">Keluar</button>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab-btn ${state.tab===t.key?'active':''}" data-tab="${t.key}">${t.label}</button>`).join('')}
    </div>
    <div class="content" id="content"></div>
    ${state.toast? `<div class="toast">${esc(state.toast)}</div>`:''}
    ${state.modal? renderModal(): ''}
  `;

  document.getElementById('logout-btn').onclick = ()=>{
    sessionStorage.removeItem('simitra_logged_in');
    state.loggedIn = false;
    render();
  };
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; render(); };
  });

  const content = document.getElementById('content');
  if(CONFIG_IS_DEFAULT){
    content.innerHTML = `<div class="config-warning">
      ⚠️ Firebase belum dikonfigurasi. Buka file ini di editor teks, cari <b>FIREBASE_CONFIG</b>
      di bagian atas script, dan isi dengan config project Firebase Anda sendiri
      (lihat instruksi lengkap di komentar awal file / panduan yang diberikan).
      Untuk sementara data hanya tampil kosong dan tidak akan tersimpan.
    </div>` + content.innerHTML;
  }

  if(state.tab==='dashboard') renderDashboard();
  else if(state.tab==='alat') renderAlatTab();
  else if(state.tab==='material') renderMaterialTab();
  else if(state.tab==='pinjam') renderPinjamTab();
  else if(state.tab==='freon') renderFreonTab();

  bindModalEvents();
}

========================================================================= */

        <div class="num">${state.material.length}</div>
        <div class="label">Total Jenis Material WS</div>
      </div>
      <div class="stat-card" data-kind="totalpinjam">
        <div class="icon">🔁</div>
        <div class="num">${state.pinjam.length}</div>
        <div class="label">Total Peminjaman Tercatat</div>
      </div>

        <div class="num">${state.freon.length}</div>
        <div class="label">Total Peminjaman Freon</div>

  wrap.querySelectorAll('[data-kind="rusak"]').forEach(el=>{

/* =========================================================================
   8. TAB: ALAT KERJA TEKNISI
========================================================================= */
function renderAlatTab(){
  const content = document.getElementById('content');
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="toolbar">
      <input type="text" id="search-alat" placeholder="Cari nama alat / teknisi..." />
      <button class="btn" id="add-alat-btn">+ Tambah Alat</button>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>Foto</th><th>Nama Teknisi</th><th>Nama Alat</th><th>Merek</th><th>Jumlah</th>
        <th>Kondisi</th><th>No. Alat</th><th>Tgl Masuk</th><th>Penanggung Jawab</th><th>Jabatan</th><th></th>
      </tr></thead>
      <tbody id="alat-tbody"></tbody>
    </table>
    </div>
  `;
  content.appendChild(wrap);

  const tbody = wrap.querySelector('#alat-tbody');
  function draw(filter){
    const f = (filter||'').toLowerCase();
    const rows = state.alat.filter(a =>
      !f || (a.namaAlat||'').toLowerCase().includes(f) || (a.namaTeknisi||'').toLowerCase().includes(f));
    tbody.innerHTML = rows.length ? rows.map(a=>`
      <tr>
        <td>${a.fotoURL? `<img class="thumb" src="${a.fotoURL}">` : '-'}</td>
        <td>${esc(a.namaTeknisi)}</td>
        <td>${esc(a.namaAlat)}</td>
        <td>${esc(a.merek)}</td>
        <td>${esc(a.jumlah)}</td>
        <td><span class="badge ${badgeClass(a.kondisi)}">${esc(a.kondisi)}</span></td>
        <td>${esc(a.nomorAlat)}</td>
        <td>${esc(a.tanggalMasuk)}</td>
        <td>${esc(a.pemilik)}</td>
        <td>${esc(a.jabatan)}</td>
        <td>
          <button class="btn small secondary" data-edit="${a.id}">Edit</button>
          <button class="btn small danger" data-del="${a.id}">Hapus</button>
        </td>

function hitungNilaiAkhirFreon(sebelum, isiToko, kembali){
  const s = parseFloat(sebelum)||0, i = parseFloat(isiToko)||0, k = parseFloat(kembali)||0;
  return +(s + i - k).toFixed(2);
}

function renderModal(){
  const m = state.modal;
  if(!m) return '';
  if(m.type==='alat-form') return modalAlatForm(m.data);
  if(m.type==='material-form') return modalMaterialForm(m.data);
  if(m.type==='pinjam-form') return modalPinjamForm(m.data);
  if(m.type==='freon-form') return modalFreonForm(m.data);

  if(m.type==='kategori-detail') return modalKategoriDetail(m.key);

  return '';
}

function bindModalEvents(){
  const ov = document.getElementById('ov');
  if(!ov) return;
  const closeModal = ()=>{ state.modal=null; render(); };
  document.getElementById('modal-close')?.addEventListener('click', closeModal);
  document.getElementById('modal-cancel')?.addEventListener('click', closeModal);
  ov.addEventListener('click', (e)=>{ if(e.target.id==='ov') closeModal(); });

  const posisiSelect = document.getElementById('posisi-select');
  if(posisiSelect){
    posisiSelect.addEventListener('change', ()=>{
      document.getElementById('posisi-lainnya-wrap').style.display =
        posisiSelect.value==='Lainnya' ? 'block' : 'none';
    });
  }

  const alatForm = document.getElementById('alat-form');
  if(alatForm) alatForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!db){ showToast('Firebase belum dikonfigurasi'); return; }
    const fd = new FormData(alatForm);
    const file = fd.get('foto');
    const editing = state.modal.data;
    const submitBtn = document.getElementById('modal-submit');
    submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...';
    let fotoURL = editing ? editing.fotoURL || "" : "";
    try{
      if(file && file.size > 0) fotoURL = await uploadPhoto(file, 'alatTeknisi', (pct)=>{ submitBtn.textContent = `Mengupload foto ${pct}%...`; });
      const payload = {
        namaTeknisi: fd.get('namaTeknisi')||'', namaAlat: fd.get('namaAlat')||'',
        merek: fd.get('merek')||'', jumlah: fd.get('jumlah')||0, kondisi: fd.get('kondisi')||'Baik',
        nomorAlat: fd.get('nomorAlat')||'', fotoURL, keterangan: fd.get('keterangan')||'',
        tanggalMasuk: fd.get('tanggalMasuk')||'', pemilik: fd.get('pemilik')||'', jabatan: fd.get('jabatan')||'',
        createdAt: editing ? editing.createdAt : firebase.firestore.FieldValue.serverTimestamp(),
      };
      if(editing) await db.collection('alatTeknisi').doc(editing.id).set(payload, {merge:true});
      else await db.collection('alatTeknisi').add(payload);
      showToast('Data alat tersimpan');
      state.modal = null; render();
    } catch(err){ alert('Gagal menyimpan: '+err.message); submitBtn.disabled=false; submitBtn.textContent='Simpan'; }
  });

  const matForm = document.getElementById('material-form');
  if(matForm) matForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!db){ showToast('Firebase belum dikonfigurasi'); return; }
    const fd = new FormData(matForm);
    const file = fd.get('foto');
    const editing = state.modal.data;
    const submitBtn = document.getElementById('modal-submit');
    submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...';
    let fotoURL = editing ? editing.fotoURL || "" : "";
    try{
      if(file && file.size > 0) fotoURL = await uploadPhoto(file, 'stokMaterial', (pct)=>{ submitBtn.textContent = `Mengupload foto ${pct}%...`; });
      const payload = {
        fotoURL, namaAlat: fd.get('namaAlat')||'', jenis: fd.get('jenis')||'',
        jumlahPcs: fd.get('jumlahPcs')||0, total: fd.get('total')||'', harga: fd.get('harga')||0,
        posisi: fd.get('posisi')||'Gudang', posisiLainnya: fd.get('posisiLainnya')||'',
        createdAt: editing ? editing.createdAt : firebase.firestore.FieldValue.serverTimestamp(),
      };
      if(editing) await db.collection('stokMaterial').doc(editing.id).set(payload, {merge:true});
      else await db.collection('stokMaterial').add(payload);
      showToast('Data material tersimpan');
      state.modal = null; render();
    } catch(err){ alert('Gagal menyimpan: '+err.message); submitBtn.disabled=false; submitBtn.textContent='Simpan'; }
  });

  const freonForm = document.getElementById('freon-form');
  if(freonForm){
    const sInput = document.getElementById('fr-sebelum');
    const iInput = document.getElementById('fr-isitoko');
    const kInput = document.getElementById('fr-kembali');
    const outEl = document.getElementById('fr-nilai-akhir');
    const updatePreview = ()=>{
      outEl.textContent = hitungNilaiAkhirFreon(sInput.value, iInput.value, kInput.value) + ' kg';
    };
    [sInput, iInput, kInput].forEach(inp => inp.addEventListener('input', updatePreview));

    freonForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!db){ showToast('Firebase belum dikonfigurasi'); return; }
      const fd = new FormData(freonForm);
      const editing = state.modal.data;
      const submitBtn = document.getElementById('modal-submit');
      submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...';
      let fotoSebelum = editing ? editing.timbangSebelumFoto || "" : "";
      let fotoIsiToko = editing ? editing.isiTokoFoto || "" : "";
      let fotoKembali = editing ? editing.timbangKembaliFoto || "" : "";
      try{
        const fSebelum = fd.get('fotoSebelum'), fIsiToko = fd.get('fotoIsiToko'), fKembali = fd.get('fotoKembali');
        if(fSebelum && fSebelum.size > 0) fotoSebelum = await uploadPhoto(fSebelum, 'peminjamanFreon', (pct)=>{ submitBtn.textContent = `Upload foto 1/3: ${pct}%`; });
        if(fIsiToko && fIsiToko.size > 0) fotoIsiToko = await uploadPhoto(fIsiToko, 'peminjamanFreon', (pct)=>{ submitBtn.textContent = `Upload foto 2/3: ${pct}%`; });
        if(fKembali && fKembali.size > 0) fotoKembali = await uploadPhoto(fKembali, 'peminjamanFreon', (pct)=>{ submitBtn.textContent = `Upload foto 3/3: ${pct}%`; });

        const sebelum = fd.get('timbangSebelumNilai');
        const isiToko = fd.get('isiTokoNilai');
        const kembali = fd.get('timbangKembaliNilai');
        const nilaiAkhir = hitungNilaiAkhirFreon(sebelum, isiToko, kembali);

        const payload = {
          namaTeknisi: fd.get('namaTeknisi')||'', jabatan: fd.get('jabatan')||'',
          jenisFreon: fd.get('jenisFreon')||'R32', nomorFreon: fd.get('nomorFreon')||'',
          timbangSebelumNilai: sebelum||0, timbangSebelumFoto: fotoSebelum,
          isiTokoNilai: isiToko||0, isiTokoFoto: fotoIsiToko,
          timbangKembaliNilai: kembali||0, timbangKembaliFoto: fotoKembali,
          nilaiAkhir: nilaiAkhir,
          createdAt: editing ? editing.createdAt : firebase.firestore.FieldValue.serverTimestamp(),
        };
        if(editing) await db.collection('peminjamanFreon').doc(editing.id).set(payload, {merge:true});
        else await db.collection('peminjamanFreon').add(payload);
        showToast('Data peminjaman freon tersimpan');
        state.modal = null; render();
      } catch(err){ alert('Gagal menyimpan: '+err.message); submitBtn.disabled=false; submitBtn.textContent='Simpan'; }
    });
  }

  const pinjamForm = document.getElementById('pinjam-form');
  if(pinjamForm) pinjamForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!db){ showToast('Firebase belum dikonfigurasi'); return; }
    const fd = new FormData(pinjamForm);
    const editing = state.modal.data;
    const submitBtn = document.getElementById('modal-submit');
    submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...';
    try{
      const payload = {
        namaPeminjam: fd.get('namaPeminjam')||'', namaAlat: fd.get('namaAlat')||'',
        tanggalPinjam: fd.get('tanggalPinjam')||'', tanggalKembali: fd.get('tanggalKembali')||'',
        tanggalKembaliAktual: fd.get('tanggalKembaliAktual')||'',
        createdAt: editing ? editing.createdAt : firebase.firestore.FieldValue.serverTimestamp(),
      };
      if(editing) await db.collection('peminjaman').doc(editing.id).set(payload, {merge:true});
      else await db.collection('peminjaman').add(payload);
      showToast('Data peminjaman tersimpan');
      state.modal = null; render();
    } catch(err){ alert('Gagal menyimpan: '+err.message); submitBtn.disabled=false; submitBtn.textContent='Simpan'; }
  });
}

/* =========================================================================
   13. INIT
========================================================================= */
render();
if(state.loggedIn && db) attachListeners();

// re-attach listeners right after successful login too
const origRender = render;
document.addEventListener('click', ()=>{
  if(state.loggedIn && db && !window.__simitraListenersAttached){
    window.__simitraListenersAttached = true;
    attachListeners();
  }
}, {once:false});
</script>
</body>
</html>
